name: sistema_afiliados_app
description: "App de Sistema Afiliados"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  provider: ^6.1.2
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  flutter_dotenv: ^6.0.0
  intl: ^0.20.2
  google_maps_flutter: ^2.12.3
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.4.1
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1
  table_calendar: ^3.1.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  package_info_plus: ^8.0.0
  image_picker: ^1.1.2
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/app_icon.png
    - assets/images/portada2.jpeg
    - assets/geo/michoacan.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Gladyz_Butanda.png"
  remove_alpha_ios: true
  # Firebase Messaging requiere minSdk >= 23
  min_sdk_android: 23
